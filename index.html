<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Upstage Co — Attendance &amp; Break Log Tool</title>
<style>
  :root{
    --ink:#FFFFFF;
    --panel:#F6F6F6;
    --panel-2:#ECECEC;
    --line:#DDDDDD;
    --accent:#0A0A0A;
    --accent-dim:#ECECEC;
    --ok:#2FD97B;
    --ok-dim:#123321;
    --warn:#F5B301;
    --warn-dim:#332601;
    --danger:#FF4D4D;
    --danger-dim:#3A1414;
    --text:#0A0A0A;
    --muted:#6B6B6B;
    --radius:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--text);}
  body{overscroll-behavior-y:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--ink);}
  .wide #app{max-width:1180px;}

  /* ---------- Generic ---------- */
  a{color:inherit;}
  button{font-family:inherit;}
  .btn{
    appearance:none;border:none;border-radius:12px;padding:16px 18px;font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px;
    transition:transform .08s ease, filter .15s ease; color:var(--text);
  }
  .btn:active{transform:scale(.97);}
  .btn-block{width:100%;}
  .btn-lg{padding:22px 18px;font-size:19px;border-radius:16px;}
  .btn-accent{background:var(--accent);color:#FFFFFF;}
  .btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .btn-ok{background:var(--ok);color:#052914;}
  .btn-warn{background:var(--warn);color:#2b2000;}
  .btn-danger{background:var(--danger);color:#2b0303;}
  .btn-outline-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn[disabled]{opacity:.35;pointer-events:none;}
  .btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;}
  .row{display:flex;align-items:center;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .settings-checkbox-row{display:flex;align-items:center;gap:12px;width:100%;margin:0;}
  .settings-checkbox-row span{flex:1;min-width:0;}
  .settings-checkbox-row input[type="checkbox"]{width:18px;height:18px;flex:none;margin:0;padding:0;}
  .col{display:flex;flex-direction:column;}
  .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .tiny{font-size:11px;}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:0;}
  .h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .h3{font-size:15px;font-weight:700;margin:0;color:var(--muted);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .card-tight{padding:12px 14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .pill-ok{background:var(--ok-dim);color:var(--ok);}
  .pill-warn{background:var(--warn-dim);color:var(--warn);}
  .pill-danger{background:var(--danger-dim);color:var(--danger);}
  .pill-muted{background:var(--panel-2);color:var(--muted);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-ok{background:var(--ok);} .dot-warn{background:var(--warn);} .dot-danger{background:var(--danger);} .dot-muted{background:var(--muted);}
  input,select,textarea{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:13px 14px;font-size:15.5px;width:100%;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  label{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block;text-transform:none;}
  .field{margin-bottom:14px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .topbrand{position:sticky;top:0;z-index:21;background:var(--ink);padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);}
  .backbtn{background:none;border:none;color:var(--text);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;padding:4px;}
  .content{padding:16px 18px 100px;flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1px solid var(--line);flex-shrink:0;}
  .toast{position:fixed;bottom:110px;left:calc(50% + 105px);transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.15); max-width:90%; text-align:center;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .wide .modal-bg{align-items:center;}
  .modal{background:var(--ink);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none;}
  .wide .modal{border-radius:16px;border-bottom:1px solid var(--line);}
  .bottomnav{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .navbtn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:10.5px;font-weight:700;}
  .navbtn.active{color:var(--accent);}
  .navico{font-size:19px;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .photo-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);}
  video,canvas{width:100%;border-radius:14px;background:#000;}
  .flowbig{font-size:44px;font-weight:800;letter-spacing:-1px;}
  ::-webkit-scrollbar{display:none;}
  .link{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;}
  .badge-req{color:var(--accent);font-weight:800;}
  .sidebar{display:none;}
  .wide .layout{display:flex;}
  .wide .sidebar{display:flex;flex-direction:column;width:220px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px;min-height:100vh;}
  .wide .main{flex:1;min-width:0;}
  .wide .bottomnav{display:none;}
  .sidebtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;text-align:left;width:100%;}
  .sidebtn.active{background:var(--accent-dim);color:var(--accent);}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;flex:1;min-width:110px;}
  .kpi .num{font-size:24px;font-weight:800;}
  .kpi .lab{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:10px;}
  /* Mobile browser adjustments */
@media (max-width: 768px) {
  .toast {
    left: 50%;
  }
}
/* Job Start / End tracking */
.job-track-card{padding:16px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.job-track-card.active{background:#f3fff6;border-color:#93e6aa}
.job-track-btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.job-start{background:#16a34a}
.job-end{background:#dc2626}
.job-track-btn:hover{filter:brightness(.94)}
.job-track-icon{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:50%;background:#fff}
.job-start .job-track-icon{color:#16a34a}
.job-end .job-track-icon{color:#dc2626}

</style>
</head>

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function ausNow(){
  const p=new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Sydney",hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date());
  const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
  return {year:+v.year,month:+v.month,day:+v.day,hour:+v.hour,minute:+v.minute,second:+v.second,time:`${v.hour}:${v.minute}:${v.second}`};
}
const BREAK_DESCRIPTORS=[
  {key:"morning-break",name:"Morning Break",aliases:["Morning Tea","Morning Tea (Smoko)"] ,minutes:20,paid:true,startMinute:600,endMinute:660,startLabel:"START BREAK",endLabel:"END BREAK"},
  {key:"lunch",name:"Lunch",aliases:["Lunch"],minutes:30,paid:false,startMinute:780,endMinute:840,startLabel:"START LUNCH",endLabel:"END LUNCH"}
];
function sydneyDateKey(value=new Date()){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(value));
}
function currentBreakDescriptor(){
  const t=ausNow(),minute=t.hour*60+t.minute;
  return BREAK_DESCRIPTORS.find(b=>minute>=b.startMinute&&minute<b.endMinute)||null;
}
function breakDescriptorForType(type){
  const normalized=String(type||"").trim().toLowerCase();
  return BREAK_DESCRIPTORS.find(b=>b.name.toLowerCase()===normalized||b.aliases.some(a=>a.toLowerCase()===normalized))||null;
}
function breakTakenFromRows(empId,descriptor,dateKey,attendanceRows,breakRows){
  const attendanceIds=new Set(attendanceRows.filter(a=>a.employeeId===empId).map(a=>a.id));
  return breakRows.some(b=>attendanceIds.has(b.attendanceId)&&breakDescriptorForType(b.type)?.key===descriptor.key&&sydneyDateKey(b.start)===dateKey);
}
function currentBreakEligibility(empId,attendanceRows=DB.attendance,breakRows=DB.breaks){
  const descriptor=currentBreakDescriptor(),dateKey=sydneyDateKey();
  const att=attendanceRows.find(a=>a.employeeId===empId&&!a.timeOut);
  const openBreak=att&&breakRows.find(b=>b.attendanceId===att.id&&!b.end);
  const taken=descriptor?breakTakenFromRows(empId,descriptor,dateKey,attendanceRows,breakRows):false;
  return {descriptor,dateKey,att,openBreak,taken,eligible:!!(descriptor&&att&&!openBreak&&!taken)};
}
function workReminderType(){ return currentBreakDescriptor()?.key||null; }
function fmtTime(iso){ if(!iso) return "—"; return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString([], {day:'2-digit',month:'2-digit',year:'2-digit'}); }
function mins(ms){ return Math.round(ms/60000); }
function hm(totalMins){
  totalMins = Math.max(0, Math.round(totalMins));
  const h = Math.floor(totalMins/60), m = totalMins%60;
  return (h>0? h+"h ":"") + m+"m";
}

const postJobOtReminder={timer:null,key:"",resolving:false};

function postJobOtPendingState(){
  const emp=currentEmployee();
  if(!emp) return null;
  const att=empOpenAttendance(emp.id);
  if(!att?.otReconfirmJobTimeEntryId||!att.otReconfirmDeadline) return null;
  if(empOpenBreak(att.id)) return null;
  if((DB.jobTimeEntries||[]).some(e=>e.employeeId===emp.id&&!e.endTime)) return null;
  const deadline=new Date(att.otReconfirmDeadline);
  if(Number.isNaN(deadline.getTime())) return null;
  return {emp,att,jobTimeEntryId:att.otReconfirmJobTimeEntryId,deadline,
    key:`${att.id}|${att.otReconfirmJobTimeEntryId}|${att.otReconfirmDeadline}`};
}
function clearPostJobOtReminder(removeModal=true){
  clearTimeout(postJobOtReminder.timer);
  postJobOtReminder.timer=null;postJobOtReminder.key="";
  if(removeModal) document.getElementById("postJobOtReminder")?.remove();
}
function invalidateStalePostJobOtReminder(){
  const pending=postJobOtPendingState(),modal=document.getElementById("postJobOtReminder");
  if(pending?.key===postJobOtReminder.key && (!modal||modal.dataset.pendingKey===pending.key)) return false;
  const changed=!!modal||!!postJobOtReminder.timer||!!postJobOtReminder.key;
  clearPostJobOtReminder();
  if(!pending) postJobOtReminder.resolving=false;
  return changed;
}
async function reconcilePostJobOtCore(){
  const employeeId=DB.session?.employeeId,role=DB.session?.role;
  if(!employeeId) return false;
  const revision=++coreRealtime.revision,generation=coreRealtime.generation;
  try{
    const snapshot=await fetchCoreTimeFromSupabase(employeeId,isAdminRole(role));
    if(generation!==coreRealtime.generation||revision!==coreRealtime.revision||
       DB.session?.employeeId!==employeeId||DB.session?.role!==role) return false;
    Object.assign(DB,snapshot);invalidateStaleBreakModal();invalidateStalePostJobOtReminder();save();
    return true;
  }catch(error){console.error("Post-job OT reconciliation error:",error);return false;}
}
async function applyPostJobOtAutoTimeout(capturedKey){
  const pending=postJobOtPendingState();
  if(!pending||pending.key!==capturedKey||postJobOtReminder.resolving) return;
  if(navigator.onLine===false) return;
  postJobOtReminder.resolving=true;
  let failed=false;
  const retry=()=>{
    failed=true;clearTimeout(postJobOtReminder.timer);
    postJobOtReminder.timer=setTimeout(()=>{postJobOtReminder.timer=null;applyPostJobOtAutoTimeout(capturedKey);},15000);
  };
  try{
    const {data,error}=await supabaseClient.rpc("apply_post_job_ot_auto_timeout",{
      p_attendance_id:pending.att.id,p_job_time_entry_id:pending.jobTimeEntryId
    }).single();
    if(error) throw error;
    const reconciled=await reconcilePostJobOtCore();
    if(!reconciled) retry();
    if(data?.applied){
      audit(pending.emp.name,"Automatic Post-job OT Time Out",jobName(pending.att.jobId),`No response by ${fmtTime(pending.att.otReconfirmDeadline)}.`);
      toast("Shift automatically ended at the overtime deadline.");
    }else if(postJobOtPendingState()?.key===capturedKey) retry();
  }catch(error){
    failed=true;console.error("Post-job OT automatic Time Out error:",error);
    retry();
  }finally{
    postJobOtReminder.resolving=false;
    if(!failed) syncPostJobOtReminder();
    scheduleRealtimeRender();
  }
}
async function resolvePostJobOt(pending,action,gps=null,address=null,summary=""){
  const current=postJobOtPendingState();
  if(!current||current.key!==pending.key||postJobOtReminder.resolving) return;
  postJobOtReminder.resolving=true;clearPostJobOtReminder();
  try{
    const {data,error}=await supabaseClient.rpc("resolve_post_job_ot_reconfirmation",{
      p_attendance_id:pending.att.id,p_job_time_entry_id:pending.jobTimeEntryId,p_action:action,
      p_gps_out_lat:gps?.lat??null,p_gps_out_lng:gps?.lng??null,
      p_gps_out_address:address,p_summary:summary
    }).single();
    if(error) throw error;
    await reconcilePostJobOtCore();
    if(data?.applied){
      if(action==="track_ot") toast("Continuing work — overtime tracking confirmed.");
      else{
        audit(pending.emp.name,"Clock Out",jobName(pending.att.jobId),"Resolved post-job overtime reminder.");
        toast("Time Out recorded");go("emp-home");
      }
    }else toast("Overtime status changed. Current attendance was refreshed.");
  }catch(error){
    console.error("Post-job OT resolution error:",error);
    toast("Overtime response could not be saved. Please try again.");
    await reconcilePostJobOtCore();
  }finally{postJobOtReminder.resolving=false;syncPostJobOtReminder();scheduleRealtimeRender();}
}

  w.id="postJobOtReminder";w.className="modal-bg";w.dataset.pendingKey=pending.key;

  </div>`;
  document.body.appendChild(w);
  w.querySelector("#postJobOtContinue").onclick=()=>resolvePostJobOt(pending,"track_ot");
  w.querySelector("#postJobOtOut").onclick=()=>{

  };
}
function syncPostJobOtReminder(){
  if(!DB.session){clearPostJobOtReminder();return;}
  const pending=postJobOtPendingState();
  if(!pending){clearPostJobOtReminder();return;}
  if(postJobOtReminder.resolving) return;
  if(postJobOtReminder.key!==pending.key||(!postJobOtReminder.timer&&!postJobOtReminder.resolving)){
    clearPostJobOtReminder();postJobOtReminder.key=pending.key;
    postJobOtReminder.timer=setTimeout(()=>{
      postJobOtReminder.timer=null;applyPostJobOtAutoTimeout(pending.key);
    },Math.max(0,pending.deadline.getTime()-Date.now()));
  }
  if(!postJobOtReminder.resolving&&!document.getElementById("postJobOtReminder")) showPostJobOtReminder(pending);
}

function fourPmCutoffState(){
  const t=ausNow();
  const minsNow=t.hour*60+t.minute;
  const fourPm=16*60;
  return {
    prompt:minsNow>=fourPm&&minsNow<fourPm+FOUR_PM_GRACE_MINUTES,
    expired:minsNow>=fourPm+FOUR_PM_GRACE_MINUTES,
    today:sydneyDateKey()
  };
}
function fourPmSydneyISO(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",timeZoneName:"longOffset",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));
  const offset=(v.timeZoneName.match(/[+-]\d{2}:\d{2}/)||["+10:00"])[0];
  return new Date(`${v.year}-${v.month}-${v.day}T16:00:00${offset}`).toISOString();
}
function offerFourPmDecision(emp,att,cutoff){
  const key=`${att.id}|${cutoff.today}`;
  const activeJob=(DB.jobTimeEntries||[]).find(e=>e.employeeId===emp.id&&!e.endTime);
  if(fourPmDecisionOffer.key===key){showFourPmReminder(emp,att,activeJob);return;}
  if(!showFourPmReminder(emp,att,activeJob)) return;
  const scheduledDeadline=new Date(fourPmSydneyISO()).getTime()+FOUR_PM_GRACE_MINUTES*60*1000;
  fourPmDecisionOffer.key=key;
  fourPmDecisionOffer.responseDeadline=Math.max(scheduledDeadline,Date.now()+FOUR_PM_GRACE_MINUTES*60*1000);
}

  if(!modal) return false;

  const confirmedToday=att?.overtimeConfirmedAt&&
    sydneyDateKey(att.overtimeConfirmedAt)===cutoff.today;
  if(att?.id===modal.dataset.attendanceId&&!confirmedToday) return false;
  modal.remove();fourPmDecisionOffer.key="";fourPmDecisionOffer.responseDeadline=0;
  return true;
}
async function autoFourPmCutoff(emp,att){
  const cutoffISO=fourPmSydneyISO();
  const activeJob=(DB.jobTimeEntries||[]).find(e=>e.employeeId===emp.id&&!e.endTime);

  if(activeJob){
    const ok=await closeJobAt(activeJob,cutoffISO,"automatic-4pm-cutoff");
    if(!ok){console.error("4 PM cutoff: job could not be closed.");return false;}
  }
att.timeOut=cutoffISO;
att.grossMin=mins(new Date(cutoffISO)-new Date(att.timeIn));

const brks=DB.breaks.filter(b=>att.breakIds.includes(b.id));
att.unpaidBreakMin=brks.filter(b=>!b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
att.paidBreakMin=brks.filter(b=>b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
att.netMin=att.grossMin-att.unpaidBreakMin;
att.status="draft";

const {error}=await supabaseClient.from("attendance").update({
  time_out:cutoffISO,
  gross_minutes:att.grossMin,
  unpaid_break_minutes:att.unpaidBreakMin,
  paid_break_minutes:att.paidBreakMin,
  net_minutes:att.netMin,
  status:"draft",
  updated_at:nowISO()
}).eq("id",att.id);

if(error){
  console.error("4 PM attendance cutoff error:",error);
  return false;
}

save();

  return true;
}
function checkWorkReminders(){
  if(!DB.session) return;
  const invalidated=invalidateStaleBreakModal();
  invalidateStaleFourPmReminder();
  const emp=currentEmployee(),att=emp?empOpenAttendance(emp.id):null;
  if(invalidated&&route.name==="emp-home") render();
  if(!emp||!att){fourPmDecisionOffer.key="";fourPmDecisionOffer.responseDeadline=0;return;}
  if(empOpenBreak(att.id)) return;

  syncPostJobOtReminder();
  if(postJobOtPendingState()) return;

  const cutoff=fourPmCutoffState();
  if(att.overtimeConfirmedAt){
  const confirmedSydney=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(att.overtimeConfirmedAt));
  if(confirmedSydney===cutoff.today)overtimeConfirmedDate=cutoff.today;
}
if(cutoff.prompt&&overtimeConfirmedDate!==cutoff.today){
  offerFourPmDecision(emp,att,cutoff);
  return;
}

if(cutoff.expired&&overtimeConfirmedDate!==cutoff.today){
  const offerKey=`${att.id}|${cutoff.today}`;
  if(fourPmDecisionOffer.key!==offerKey||Date.now()<fourPmDecisionOffer.responseDeadline){
    offerFourPmDecision(emp,att,cutoff);
    return;
  }
  if(fourPmDecisionOffer.processing) return;
  fourPmDecisionOffer.processing=true;
  autoFourPmCutoff(emp,att).then(ok=>{
    if(ok){
      fourPmDecisionOffer.key="";fourPmDecisionOffer.responseDeadline=0;
      toast("Shift automatically ended at 4:00 PM.");
      audit(emp.name,"Automatic 4 PM Time Out",jobName(att.jobId),"No response to 4 PM reminder within 10 minutes.");
      go("emp-home");
    }
  }).finally(()=>{fourPmDecisionOffer.processing=false;});
  return;
}

  const eligibility=currentBreakEligibility(emp.id);
  const startButton=document.getElementById("btnStartBreak");
  const buttonMatches=eligibility.eligible ? !!startButton&&startButton.textContent.includes(eligibility.descriptor.startLabel) : !startButton;
  if(route.name==="emp-home"&&!document.querySelector(".modal-bg")&&!buttonMatches) render();
  if(!eligibility.eligible) return;
  const snoozeKey=breakSnoozeKey(emp.id,eligibility.dateKey,eligibility.descriptor.key);
  if(Date.now()<(workReminderSnoozeUntil[snoozeKey]||0)) return;
  showBreakReminder(eligibility.descriptor,emp.id,eligibility.dateKey);
}

function hmsLive(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

const coreRealtime={channel:null,userId:null,employeeId:null,role:null,generation:0,
  timer:null,revision:0,refreshing:false,pending:false,interrupted:false};
const supportRealtime={timer:null,revision:0,refreshing:false,corrections:false,worklogs:false,renderTimer:null};
const jobsRealtime={timer:null,revision:0,refreshing:false,dirty:false};
let jobActionInProgress=0;
function stopCoreRealtime(){
  coreRealtime.generation++;
  clearTimeout(coreRealtime.timer);
  clearTimeout(supportRealtime.timer);
  clearTimeout(supportRealtime.renderTimer);
  clearTimeout(jobsRealtime.timer);
  coreRealtime.timer=null;
  jobsRealtime.timer=null;
  supportRealtime.timer=supportRealtime.renderTimer=null;
  supportRealtime.refreshing=supportRealtime.corrections=supportRealtime.worklogs=false;
  jobsRealtime.refreshing=jobsRealtime.dirty=false;
  const channel=coreRealtime.channel;
  coreRealtime.channel=null;
  coreRealtime.userId=coreRealtime.employeeId=coreRealtime.role=null;
  coreRealtime.pending=coreRealtime.refreshing=coreRealtime.interrupted=false;
  fourPmDecisionOffer.key="";fourPmDecisionOffer.responseDeadline=0;fourPmDecisionOffer.processing=false;
  postJobOtReminder.resolving=false;clearPostJobOtReminder();
  if(channel) supabaseClient.removeChannel(channel).then(status=>{
    if(status!=="ok") console.error("Core Realtime removal status:",status);
  }).catch(error=>console.error("Core Realtime removal error:",error));
}
function renderRealtimeIfSafe(){
  if(coreRealtime.pending || coreRealtime.refreshing || supportRealtime.refreshing ||
     supportRealtime.corrections || supportRealtime.worklogs || jobsRealtime.refreshing ||
     jobsRealtime.dirty || jobActionInProgress) return;
  if(document.querySelector(".modal-bg")) return;
  const readOnlyJobDetail=route.name==="admin-job-detail" && DB.jobs.find(j=>j.id===route.id)?.status==="Completed";
  if(readOnlyJobDetail || ["emp-home","history","timesheet","worklog","admin-dashboard","admin-live","admin-timesheets","admin-jobs"].includes(route.name)) render();
}
function scheduleRealtimeRender(){
  clearTimeout(supportRealtime.renderTimer);
  supportRealtime.renderTimer=setTimeout(renderRealtimeIfSafe,200);
}
function scheduleCoreTimeRefresh(){
  if(!coreRealtime.channel || !DB.session || DB.session.employeeId!==coreRealtime.employeeId || DB.session.role!==coreRealtime.role) return;
  coreRealtime.revision++;
  coreRealtime.pending=true;
  clearTimeout(coreRealtime.timer);
  coreRealtime.timer=setTimeout(refreshCoreTimeFromRealtime,300);
}
function invalidateStaleBreakModal(){
  const modal=document.querySelector("#workReminder[data-break-key],#startBreakModal[data-break-key]");
  const emp=currentEmployee();
  if(!modal||!emp) return false;
  const eligibility=currentBreakEligibility(emp.id);
  if(!eligibility.eligible||eligibility.descriptor.key!==modal.dataset.breakKey){modal.remove();return true;}

function applyFourPmAttendanceRealtime(payload){
  const row=payload?.new,emp=currentEmployee();
  if(!row?.id||!emp||row.employee_id!==emp.id) return;
  const att=empOpenAttendance(emp.id);
  if(!att||att.id!==row.id) return;
  const confirmedDate=row.overtime_confirmed_at&&sydneyDateKey(row.overtime_confirmed_at);
  if(confirmedDate!==fourPmCutoffState().today) return;
  att.overtimeConfirmedAt=row.overtime_confirmed_at;
  overtimeConfirmedDate=confirmedDate;
  document.getElementById("fourPmReminder")?.remove();
  fourPmDecisionOffer.key="";fourPmDecisionOffer.responseDeadline=0;
  save();
}
async function refreshCoreTimeFromRealtime(){
  coreRealtime.timer=null;
  if(!coreRealtime.pending || coreRealtime.refreshing || !coreRealtime.channel) return;
  coreRealtime.pending=false;
  coreRealtime.refreshing=true;
  const generation=coreRealtime.generation,revision=coreRealtime.revision;
  const employeeId=coreRealtime.employeeId,role=coreRealtime.role;
  try{
    const snapshot=await fetchCoreTimeFromSupabase(employeeId,isAdminRole(role));
    if(generation!==coreRealtime.generation || revision!==coreRealtime.revision ||
       DB.session?.employeeId!==employeeId || DB.session?.role!==role) return;
    Object.assign(DB,snapshot);
    invalidateStaleBreakModal();
    invalidateStaleFourPmReminder();
    invalidateStalePostJobOtReminder();
    save();
  }catch(error){
    if(generation===coreRealtime.generation) console.error("Core Realtime sync error:",error);
  }finally{
    if(generation===coreRealtime.generation){
      coreRealtime.refreshing=false;
      if(coreRealtime.pending){
        clearTimeout(coreRealtime.timer);
        coreRealtime.timer=setTimeout(refreshCoreTimeFromRealtime,300);
      }
      syncPostJobOtReminder();scheduleRealtimeRender();
    }
  }
}
function scheduleSupportRefresh(group){
  if(!coreRealtime.channel || !DB.session || DB.session.employeeId!==coreRealtime.employeeId || DB.session.role!==coreRealtime.role) return;
  supportRealtime[group]=true;
  supportRealtime.revision++;
  clearTimeout(supportRealtime.timer);
  supportRealtime.timer=setTimeout(refreshSupportFromRealtime,300);
}
async function refreshSupportFromRealtime(){
  supportRealtime.timer=null;
  if(supportRealtime.refreshing || !coreRealtime.channel) return;
  const corrections=supportRealtime.corrections,worklogs=supportRealtime.worklogs;
  if(!corrections && !worklogs) return;
  supportRealtime.corrections=supportRealtime.worklogs=false;
  supportRealtime.refreshing=true;
  const generation=coreRealtime.generation,revision=supportRealtime.revision;
  const employeeId=coreRealtime.employeeId,role=coreRealtime.role;
  try{
    const [correctionRows,worklogRows]=await Promise.all([
      corrections?fetchCorrectionsFromSupabase():Promise.resolve(null),
      worklogs?fetchWorklogsFromSupabase(employeeId,role==="Super Admin"):Promise.resolve(null)
    ]);
    if(generation!==coreRealtime.generation || revision!==supportRealtime.revision ||
       DB.session?.employeeId!==employeeId || DB.session?.role!==role) return;
    if(corrections) DB.correctionRequests=correctionRows;
    if(worklogs) DB.worklogs=worklogRows;
    save();
  }catch(error){
    if(generation===coreRealtime.generation) console.error("Supporting Realtime sync error:",error);
  }finally{
    if(generation===coreRealtime.generation){
      if(revision!==supportRealtime.revision){
        supportRealtime.corrections ||= corrections;
        supportRealtime.worklogs ||= worklogs;
      }
      supportRealtime.refreshing=false;
      if(supportRealtime.corrections || supportRealtime.worklogs){
        clearTimeout(supportRealtime.timer);
        supportRealtime.timer=setTimeout(refreshSupportFromRealtime,300);
      }
      scheduleRealtimeRender();
    }
  }
}
function scheduleJobsRefresh(){
  if(!coreRealtime.channel || !DB.session || DB.session.employeeId!==coreRealtime.employeeId || DB.session.role!==coreRealtime.role) return;
  jobsRealtime.revision++;
  jobsRealtime.dirty=true;
  clearTimeout(jobsRealtime.timer);
  jobsRealtime.timer=setTimeout(refreshJobsFromRealtime,300);
}
async function refreshJobsFromRealtime(){
  jobsRealtime.timer=null;
  if(!jobsRealtime.dirty || jobsRealtime.refreshing || !coreRealtime.channel) return;
  jobsRealtime.dirty=false;
  jobsRealtime.refreshing=true;
  const generation=coreRealtime.generation,revision=jobsRealtime.revision;
  const employeeId=coreRealtime.employeeId,role=coreRealtime.role;
  try{
    const jobs=await fetchJobsFromSupabase();
    if(generation!==coreRealtime.generation || revision!==jobsRealtime.revision ||

    DB.jobs=jobs;
    save();
  }catch(error){
    if(generation===coreRealtime.generation) console.error("Jobs Realtime sync error:",error);
  }finally{
    if(generation===coreRealtime.generation){
      jobsRealtime.refreshing=false;
      if(jobsRealtime.dirty){
        clearTimeout(jobsRealtime.timer);
        jobsRealtime.timer=setTimeout(refreshJobsFromRealtime,300);
      }
      scheduleRealtimeRender();
    }
  }
}
function startCoreRealtime(user,profile){
  if(!user?.id || !profile?.id || DB.session?.employeeId!==profile.id || DB.session?.role!==profile.permission) return;
  if(coreRealtime.channel && coreRealtime.userId===user.id &&
     coreRealtime.employeeId===profile.id && coreRealtime.role===profile.permission) return;
  stopCoreRealtime();
  const generation=coreRealtime.generation;
  coreRealtime.userId=user.id;
  coreRealtime.employeeId=profile.id;
  coreRealtime.role=profile.permission;
  const global=isAdminRole(profile.permission);
  let channel=supabaseClient.channel(`core-time-${user.id}`);
  for(const table of ["attendance","breaks","job_time_entries"]){
    for(const event of ["INSERT","UPDATE"]){
      const options={event,schema:"public",table};
      if(!global && table!=="breaks") options.filter=`employee_id=eq.${profile.id}`;
      channel=channel.on("postgres_changes",options,payload=>{
        if(generation!==coreRealtime.generation) return;
        if(table==="attendance"&&event==="UPDATE") applyFourPmAttendanceRealtime(payload);
        scheduleCoreTimeRefresh();
      });
    }
  }
  for(const event of ["INSERT","UPDATE"]){
    const options={event,schema:"public",table:"correction_requests"};
    if(profile.permission!=="Super Admin") options.filter=`employee_id=eq.${profile.id}`;
    channel=channel.on("postgres_changes",options,()=>{
      if(generation!==coreRealtime.generation) return;
      scheduleSupportRefresh("corrections");
      if(event==="UPDATE") scheduleCoreTimeRefresh();
    });
  }
  const worklogOptions={event:"INSERT",schema:"public",table:"worklogs"};
  if(profile.permission!=="Super Admin") worklogOptions.filter=`employee_id=eq.${profile.id}`;
  channel=channel.on("postgres_changes",worklogOptions,()=>{
    if(generation===coreRealtime.generation) scheduleSupportRefresh("worklogs");
  });
  for(const event of ["INSERT","UPDATE"]){
    channel=channel.on("postgres_changes",{event,schema:"public",table:"jobs"},()=>{
      if(generation===coreRealtime.generation) scheduleJobsRefresh();
    });
  }
  coreRealtime.channel=channel;
  channel.subscribe(status=>{
    if(generation!==coreRealtime.generation) return;
    if(status==="SUBSCRIBED"){
      if(coreRealtime.interrupted){
        scheduleCoreTimeRefresh();
        scheduleSupportRefresh("corrections");
        scheduleSupportRefresh("worklogs");
        scheduleJobsRefresh();
      }
      coreRealtime.interrupted=false;
    }else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(status)){
      coreRealtime.interrupted=true;
      console.error("Core Realtime channel status:",status);
    }
  });
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && coreRealtime.channel){
    scheduleCoreTimeRefresh();
    scheduleSupportRefresh("corrections");
    scheduleSupportRefresh("worklogs");
    scheduleJobsRefresh();
  }
});

async function audit(actor,action,target,detail,worklogId=null){
  const ts=nowISO(),id=uid("aud");
  const {data:{user},error:userError}=await supabaseClient.auth.getUser();

  if(userError||!user){
    console.error("Audit user error:",userError);
    return false;
  }

  const auditRow={id,actor,action,target,detail,user_id:user.id,created_at:ts};
  if(worklogId) auditRow.worklog_id=worklogId;
  const {error}=await supabaseClient.from("audit_logs").insert(auditRow);

  if(error){
    console.error("Audit save error:",error);
    return false;
  }

  DB.auditLogs.unshift({id,actor,action,target,detail,worklogId,ts});
  try{save();}catch(cacheError){console.error("Audit cache error:",cacheError);}
  return true;
}

async function recordJobHistory(jobId, action, detail){
  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if(userError || !userData?.user){
    console.error(
      "Could not get authenticated user for job history:",
      userError
    );
    return false;
  }

  const historyRecord = {
    id: uid("jhist"),
    job_id: jobId,
    actor: DB.session?.name || "Unknown User",
    action: action,
    detail: detail,
    user_id: userData.user.id
  };

  const { data: savedHistory, error: historyError } =
    await supabaseClient
      .from("job_change_history")
      .insert(historyRecord)
      .select()
      .single();

  if(historyError){
    console.error("Job history save error:", historyError);
    return false;
  }

  if(!DB.jobChangeHistory){
    DB.jobChangeHistory = [];
  }

  DB.jobChangeHistory.unshift({
    id: savedHistory.id,
    jobId: savedHistory.job_id,
    actor: savedHistory.actor,
    action: savedHistory.action,
    detail: savedHistory.detail,
    userId: savedHistory.user_id,
    ts: savedHistory.created_at
  });

  save();

  return true;
}

/* ---------------- Derived helpers ---------------- */
function empOpenAttendance(empId){
  return DB.attendance.find(a=>a.employeeId===empId && !a.timeOut);
}
function empOpenBreak(attId){
  return DB.breaks.find(b=>b.attendanceId===attId && !b.end);
}
function empStatus(empId){
  const att = empOpenAttendance(empId);
  if(!att) return "off";
  if(empOpenBreak(att.id)) return "break";
  return "working";
}
function jobName(id){ const j=DB.jobs.find(j=>j.id===id); return j? j.name : "—"; }
function empName(id){ const e=DB.employees.find(e=>e.id===id); return e? e.name : "—"; }
function empRecordsForWeek(empId, weekStart){
  const end = new Date(weekStart); end.setDate(end.getDate()+7);
  return DB.attendance.filter(a=>a.employeeId===empId && new Date(a.timeIn)>=weekStart && new Date(a.timeIn)<end);
}
function weeklyNetMinutes(empId, weekStart){
  return empRecordsForWeek(empId, weekStart).reduce((s,a)=> s + (a.netMin || (a.timeOut? mins(new Date(a.timeOut)-new Date(a.timeIn)) - (a.unpaidBreakMin||0) : 0)),0);
}
function todayNetMinutes(empId){
  const att = DB.attendance.filter(a=>a.employeeId===empId && sameDay(a.timeIn, new Date()));
  return att.reduce((s,a)=>{
    if(a.netMin!=null) return s+a.netMin;
    if(!a.timeOut) return s; // still open, don't count yet in "today" total until timeout (live timer handles current one)
    return s;
  },0);
}

/* ---------------- Geolocation & reverse geocode ---------------- */
function isEmbeddedFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
function getPosition(opts){
  const { highAccuracy=true, timeout=12000 } = opts||{};
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve({error:"unsupported"}); return; }
    navigator.geolocation.getCurrentPosition(
      pos=> resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy}),
      err=>{
        const msg = (err.message||"").toLowerCase();
        const policyBlocked = msg.includes("policy")||msg.includes("permissions policy")||msg.includes("feature policy")||msg.includes("disabled in this document");
        if(err.code===1 && (policyBlocked || isEmbeddedFrame())){
          resolve({error:"iframe-blocked", message: err.message}); return;
        }
        resolve({error: err.code===1?"denied": err.code===3?"timeout":"unavailable", message: err.message});
      },
      {enableHighAccuracy:highAccuracy, timeout, maximumAge:0}
    );
  });
}
/* Every call re-invokes getCurrentPosition, which re-triggers the browser's native permission
   prompt any time the site's permission for this origin is still "prompt" (not yet decided).
   Once a person taps Allow/Block, the browser remembers that per-origin — no site-side code
   can force the native prompt to reappear after that; a Block decision has to be reversed in
   the browser's own site settings, so we detect that case and tell them exactly where to look. */
async function getPositionSmart(){
  if(!window.isSecureContext){
    return {error:"insecure"};
  }
  let result = await getPosition({highAccuracy:true, timeout:12000});
  if(result.error==="timeout" || result.error==="unavailable"){
    // Fall back to network/Wi-Fi based location — many desktops/laptops have no GPS chip,
    // so a high-accuracy GPS fix can time out even when location is genuinely allowed.
    result = await getPosition({highAccuracy:false, timeout:12000});
  }
  return result;
}
async function reverseGeocode(lat,lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`, {headers:{"Accept":"application/json"}});
    const j = await r.json();
    return j.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }catch(e){
    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }
}
function distMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function geofenceCheck(lat,lng){
  for(const g of DB.settings.geofences){
    if(distMeters(lat,lng,g.lat,g.lng) <= g.radiusM) return {inside:true, name:g.name};
  }
  return {inside:false, name:null};
}

function requireLocation(onSuccess, actionLabel, onCancel){
  (async function attempt(){

      </div>`;

        if(wrap.querySelector("#locSecondary")) wrap.querySelector("#locSecondary").onclick = ()=> { wrap.remove(); attempt(); };
      } else {

async function validateWorklogPhoto(file){
  const extensions={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
  if(!file || !file.size) throw new Error("Choose a non-empty photo.");
  if(!extensions[file.type]) throw new Error("Choose a JPEG, PNG, or WebP photo.");
  if(file.size>5242880) throw new Error("Photo must be 5 MiB or smaller.");
  const bytes=new Uint8Array(await file.slice(0,12).arrayBuffer());
  const text=(from,to)=>String.fromCharCode(...bytes.slice(from,to));
  const valid=file.type==="image/jpeg" ? bytes[0]===0xff&&bytes[1]===0xd8&&bytes[2]===0xff
    : file.type==="image/png" ? text(0,8)==="\x89PNG\r\n\x1a\n"
    : text(0,4)==="RIFF"&&text(8,12)==="WEBP";
  if(!valid) throw new Error("Photo file does not match its image type.");
  const previewUrl=URL.createObjectURL(file);
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=previewUrl;});
    if(!image.naturalWidth || !image.naturalHeight) throw new Error("Invalid image dimensions");
    return {extension:extensions[file.type],previewUrl};
  }catch(error){
    URL.revokeObjectURL(previewUrl);
    throw new Error("Photo could not be opened. Choose another image.");
  }
}

}

async function fetchAuthoritativeStartJobState(jobId,employeeId){
  const [jobResult,assignmentResult,openEntriesResult]=await Promise.all([
    supabaseClient.from("jobs").select("id, name, status").eq("id",jobId).maybeSingle(),
    supabaseClient.from("job_assignments").select("job_id, employee_id")
      .eq("job_id",jobId).eq("employee_id",employeeId).maybeSingle(),
    supabaseClient.from("job_time_entries")
      .select("id, employee_id, job_id, start_time, end_time, duration_seconds, end_reason, switched_to_job_id")
      .eq("employee_id",employeeId).is("end_time",null).limit(2)
  ]);
  const error=jobResult.error||assignmentResult.error||openEntriesResult.error;
  if(error) throw error;
  if(openEntriesResult.data.length>1) throw new Error("Multiple open job time entries found");
  const row=openEntriesResult.data[0];
  return {
    job:jobResult.data,
    assigned:!!assignmentResult.data,
    active:row?{
      id:row.id,employeeId:row.employee_id,jobId:row.job_id,
      startTime:row.start_time,endTime:row.end_time,
      durationSeconds:row.duration_seconds,endReason:row.end_reason,
      switchedToJobId:row.switched_to_job_id
    }:null
  };
}
async function reconcileJobsAfterRejectedStart(){

function reconcileAuthoritativeOpenJobEntry(employeeId,active){
  coreRealtime.revision++;
  DB.jobTimeEntries=[
    ...(active?[active]:[]),
    ...DB.jobTimeEntries.filter(e=>e.id!==active?.id&&(e.employeeId!==employeeId||e.endTime))
  ];
  save();
}

async function startJobTracking(jobId){
  if(navigator.onLine===false){
    toast("You're offline. Reconnect and try again.");return;
  }
  const emp=currentEmployee();
  const att=empOpenAttendance(emp.id);
  if(att&&empOpenBreak(att.id)){toast("End your current break before starting or switching jobs.");return;}
  let state;
  try{
    state=await fetchAuthoritativeStartJobState(jobId,emp.id);
  }catch(error){
    console.error("Start Job validation error:",error);
    toast("Could not verify this job. Please try again.");return;
  }
  if(!state.job || !state.assigned || state.job.status==="Completed"){
    await reconcileJobsAfterRejectedStart();
    toast(!state.assigned?"This job is no longer assigned or available.":"This job is no longer available to start.");
    return;
  }
  let active=state.active;
  const job=DB.jobs.find(j=>j.id===jobId)||state.job;
  const openAtt=DB.attendance.find(a=>a.employeeId===emp.id&&!a.timeOut);
  const ts=new Date(),iso=ts.toISOString();

  if(active&&active.jobId!==jobId){
    const oldJob=DB.jobs.find(j=>j.id===active.jobId);
    const confirmedActiveId=active.id;
    const time=ts.toLocaleTimeString("en-GB",{hour12:false});
    if(!await showSwitchJobConfirm(oldJob?.name||"current",time))return;

    try{
      state=await fetchAuthoritativeStartJobState(jobId,emp.id);
    }catch(error){
      console.error("Start Job validation error:",error);
      toast("Could not verify this job. Please try again.");return;
    }
    if(!state.job || !state.assigned || state.job.status==="Completed"){
      await reconcileJobsAfterRejectedStart();
      toast(!state.assigned?"This job is no longer assigned or available.":"This job is no longer available to start.");
      return;
    }
    active=state.active;
    if(active&&active.id!==confirmedActiveId){
      reconcileAuthoritativeOpenJobEntry(emp.id,active);
      toast("Your active job changed. Please try again.");return;
    }
    if(!active){
      reconcileAuthoritativeOpenJobEntry(emp.id,null);
    }else if(active.jobId===jobId){
      reconcileAuthoritativeOpenJobEntry(emp.id,active);
      toast("This job is already active.");return;
    }

    if(active){
      reconcileAuthoritativeOpenJobEntry(emp.id,active);
      const seconds=Math.max(0,Math.floor((ts-new Date(active.startTime))/1000));
      const {error}=await supabaseClient.from("job_time_entries").update({
        end_time:iso,duration_seconds:seconds,end_reason:"switched_job",
        switched_to_job_id:jobId,updated_at:iso
      }).eq("id",active.id);

      if(error){console.error(error);toast("Could not stop current job.");return;}
      active.endTime=iso;active.durationSeconds=seconds;
    }
  }else{
    reconcileAuthoritativeOpenJobEntry(emp.id,active);
  }

  if(active?.jobId===jobId){toast("This job is already active.");return;}

  if(!openAtt){
    const att={
      id:uid("att"),employeeId:emp.id,jobId,timeIn:iso,timeOut:null,
      photoIn:null,photoOut:null,gpsIn:null,gpsOut:null,
      geofence:"n/a",breakIds:[],grossMin:null,unpaidBreakMin:0,
      paidBreakMin:0,netMin:null,category:"Job Start",
      device:deviceLabel(),status:"draft",source:"app",summary:""
    };

    const {error}=await supabaseClient.from("attendance").insert({
      id:att.id,employee_id:emp.id,job_id:jobId,time_in:iso,time_out:null,
      photo_in:null,photo_out:null,gps_in_lat:null,gps_in_lng:null,
      gps_in_address:null,gps_out_lat:null,gps_out_lng:null,
      gps_out_address:null,geofence:"n/a",gross_minutes:null,
      unpaid_break_minutes:0,paid_break_minutes:0,net_minutes:null,
      category:"Job Start",device:att.device,status:"draft",
      source:"app",summary:""
    });

    if(error){console.error("Attendance start error:",error);toast("Could not clock in.");return;}
    if(!DB.attendance.some(a=>a.id===att.id)) DB.attendance.push(att);
  }

  const {data,error}=await supabaseClient.from("job_time_entries").insert({
    id:uid("jte"),employee_id:emp.id,job_id:jobId,start_time:iso
  }).select().single();

  if(error){
    console.error("Start Job insert error:",error);
    await reconcilePostJobOtCore();
    toast("Could not start job. Attendance or overtime status may have changed.");return;
  }

  if(!DB.jobTimeEntries.some(e=>e.id===data.id)) DB.jobTimeEntries.unshift({
    id:data.id,employeeId:data.employee_id,jobId:data.job_id,
    startTime:data.start_time,endTime:data.end_time
  });

  audit(emp.name,"Started Job",job.name,active?`Switched from ${jobName(active.jobId)}`:"");
  save();toast(`${job.name} started`);go("emp-home");
}

async function closeJobAt(active,iso,reason="manual"){
  const seconds=Math.max(0,Math.floor((new Date(iso)-new Date(active.startTime))/1000));
  const {error}=await supabaseClient.from("job_time_entries").update({
    end_time:iso,duration_seconds:seconds,end_reason:reason,updated_at:iso
  }).eq("id",active.id);
  if(error){console.error("Job close error:",error);return false;}
  active.endTime=iso;active.durationSeconds=seconds;active.endReason=reason;save();
  return true;
}
async function closeCurrentJobAt(active,iso){
  const seconds=Math.max(0,Math.floor((new Date(iso)-new Date(active.startTime))/1000));
  const {data,error}=await supabaseClient.from("job_time_entries").update({
    end_time:iso,duration_seconds:seconds,end_reason:"manual",updated_at:iso
  }).eq("id",active.id).select().single();
  if(error || !data?.end_time){console.error("Job close error:",error||"Updated row was not returned");return false;}
  coreRealtime.revision++;
  Object.assign(active,{
    employeeId:data.employee_id,jobId:data.job_id,startTime:data.start_time,
    endTime:data.end_time,durationSeconds:data.duration_seconds,endReason:data.end_reason,
    switchedToJobId:data.switched_to_job_id
  });
  DB.jobTimeEntries=[active,...DB.jobTimeEntries.filter(e=>e.id!==active.id)];
  save();
  return true;
}

async function endJobTracking(jobId){
  const emp=currentEmployee(),att=empOpenAttendance(emp.id);
  if(att&&empOpenBreak(att.id)){toast("End your current break before ending a job.");return;}
  const active=(DB.jobTimeEntries||[]).find(e=>e.employeeId===emp.id&&e.jobId===jobId&&!e.endTime);
  if(!active){toast("No active job found.");return;}

  const iso=nowISO();
  const ok=await closeCurrentJobAt(active,iso);
  if(!ok){toast("Could not end job.");return;}

  let armFailed=false;
  try{
    const {data,error}=await supabaseClient.rpc("arm_post_job_ot_reconfirmation",{
      p_job_time_entry_id:active.id
    }).single();
    if(error) throw error;
    await reconcilePostJobOtCore();
    if(data?.applied) syncPostJobOtReminder();
  }catch(error){
    armFailed=true;
    console.error("Post-job OT arm error:",error);
    await reconcilePostJobOtCore();
  }

  audit(currentEmployee().name,"Ended Job",jobName(jobId),`Duration: ${Math.floor((active.durationSeconds||0)/60)}m`);
  toast(armFailed?"Job ended, but overtime status could not be refreshed.":"Job ended");
  go("job-select");
}

function validBreakStart(empId,expectedKey){

  return eligibility.eligible&&(!expectedKey||eligibility.descriptor.key===expectedKey)?eligibility:null;
}

  const initial=emp&&validBreakStart(emp.id,expectedKey);

  if(!initial){rejectBreakStart(descriptor);return;}

  wrap.id="startBreakModal";wrap.dataset.breakKey=descriptor.key;
  wrap.innerHTML = `<div class="modal">

async function doTimeOut(){
  const emp = currentEmployee(); const att = empOpenAttendance(emp.id);
  const openBrk = empOpenBreak(att.id);
  if(openBrk){ toast("End your current break before timing out."); return; }
  const activeJob=(DB.jobTimeEntries||[]).find(e=>e.employeeId===emp.id&&!e.endTime);
const timeOutISO=nowISO();

if(activeJob){
  const activeJobName=jobName(activeJob.jobId);
  const confirmed=await showTimeOutConfirm(activeJobName,fmtTime(timeOutISO));
  if(!confirmed)return;
}

  requireLocation(async (pos)=>{
    const gps = {lat:pos.lat, lng:pos.lng, accuracy:pos.accuracy};
    const address = await reverseGeocode(pos.lat,pos.lng);
    showWorkSummaryModal(async (summary)=>{
      att.timeOut = timeOutISO;
      att.grossMin = mins(new Date(att.timeOut)-new Date(att.timeIn));
      const brks = DB.breaks.filter(b=>att.breakIds.includes(b.id));
      att.unpaidBreakMin = brks.filter(b=>!b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
      att.paidBreakMin = brks.filter(b=>b.paid).reduce((s,b)=>s+mins(new Date(b.end)-new Date(b.start)),0);
      att.netMin = att.grossMin - att.unpaidBreakMin;
      att.summary = summary; att.status="draft";
      const { error: clockOutError } = await supabaseClient
  .from("attendance")
  .update({
    time_out: att.timeOut,
    photo_out: att.photoOut,
    gps_out_lat: att.gpsOut?.lat ?? null,
    gps_out_lng: att.gpsOut?.lng ?? null,
    gps_out_address: att.gpsOut?.address ?? null,
    gross_minutes: att.grossMin,
    unpaid_break_minutes: att.unpaidBreakMin,
    paid_break_minutes: att.paidBreakMin,
    net_minutes: att.netMin,
    summary: att.summary,
    status: att.status
  })
  .eq("id", att.id);

if(clockOutError){
  console.error("Supabase clock-out error:", clockOutError);
  toast("Clock out could not be saved. Please try again.");
  return;
}
if(activeJob){
  const ok=await closeJobAt(activeJob,timeOutISO,"time-out");
  if(!ok){
    console.error("Attendance was clocked out but active job could not be closed.");
    toast("Time Out was saved, but the active job could not be stopped. Please contact an administrator.");
    return;
  }
}

audit(
  emp.name,
  "Clock Out",
  jobName(att.jobId),
  `Net: ${hm(att.netMin)} (Gross ${hm(att.grossMin)}, Break ${hm(att.unpaidBreakMin)})`
);

save();
go("emp-home");
      const breakRows = brks.map(b=> [`${b.type} (${b.paid?'paid':'unpaid'})`, hm(mins(new Date(b.end)-new Date(b.start)))]);
      setTimeout(()=> showConfirmModal("CLOCK OUT RECORDED", [
        ["Time In → Time Out", `${fmtTime(att.timeIn)} → ${fmtTime(att.timeOut)}`],
        ["Total shift time (gross)", hm(att.grossMin)],
        ...breakRows,
        ["Total break time", hm(att.unpaidBreakMin+att.paidBreakMin)+` (${hm(att.unpaidBreakMin)} unpaid, ${hm(att.paidBreakMin)} paid)`],
        ["Net hours worked today", hm(att.netMin)],
        ["Job", jobName(att.jobId)],
        ["Location", address],
        ["GPS accuracy", gps.accuracy? Math.round(gps.accuracy)+"m" : "—"]
      ]), 50);
    });
  }, "Timing out");
}

  const deadline = thursdayOfWeek(weekStart);

  const needsAction = draftCount>0 || anyRejected;
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const weekLabel = weekOffset===0? "This week" : weekOffset===-1? "Last week" : `${fmtDateShort(weekStart)} – ${fmtDateShort(weekEnd)}`;

function todayStats(){
  const emps = DB.employees.filter(e=>e.status==="active" && isFieldStaff(e));
  let working=0, onBreak=0, notClocked=0, clockedOut=0, late=0, totalMin=0;
  emps.forEach(e=>{
    const st = empStatus(e.id);
    const todays = DB.attendance.filter(a=>a.employeeId===e.id && sameDay(a.timeIn,new Date()));
    if(st==="working") working++;
    else if(st==="break") onBreak++;
    else if(todays.some(a=>a.timeOut)) clockedOut++;
    else notClocked++;
    todays.forEach(a=>{
      const t = new Date(a.timeIn);
      if(t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin)) late++;
      if(a.netMin) totalMin += a.netMin;
      else if(!a.timeOut) totalMin += mins(new Date()-new Date(a.timeIn));
    });
  });
  const missingOut = DB.attendance.filter(a=> !a.timeOut && !sameDay(a.timeIn,new Date())).length;
  return {working,onBreak,notClocked,clockedOut,late,missingOut,totalHeadcount:emps.length,totalMin};
}
function activeJobsToday(){
  return DB.jobs.map(j=>{
    const jobEntries=(DB.jobTimeEntries||[]).filter(e=>e.jobId===j.id);
    const openEntries=jobEntries.filter(e=>!e.endTime);
    const entries=jobEntries.filter(e=>sameDay(e.startTime,new Date()));
    const people=new Set(openEntries.map(e=>e.employeeId)).size;
    const hrs=entries.reduce((s,e)=>s+Math.max(0,Math.round((new Date(e.endTime||Date.now())-new Date(e.startTime))/60000)),0);
    return {job:j,people,hrs};
  }).filter(x=>x.people>0);
}

function sydney4pmISO(dateISO){
  const d=new Date(dateISO);
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",timeZoneName:"longOffset",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);
  const v=Object.fromEntries(p.map(x=>[x.type,x.value]));
  const off=(v.timeZoneName.match(/[+-]\d{2}:\d{2}/)||["+10:00"])[0];
  return new Date(`${v.year}-${v.month}-${v.day}T16:00:00${off}`);
}

function overlapSeconds(aStart,aEnd,bStart,bEnd){
  const start=Math.max(new Date(aStart),new Date(bStart));
  const end=Math.min(new Date(aEnd),new Date(bEnd));
  return Math.max(0,(end-start)/1000);
}

function unpaidBreakOverlapSeconds(att,start,end){
  return (DB.breaks||[])
    .filter(b=>b.attendanceId===att.id&&!b.paid&&b.start&&b.end)
    .reduce((sum,b)=>sum+overlapSeconds(start,end,b.start,b.end),0);
}
function payrollRows(fromDate,toDate){
  const from=fromDate?new Date(fromDate):startOfWeek();
  const to=toDate?new Date(toDate+"T23:59:59"):new Date();
  const emps=DB.employees.filter(e=>isFieldStaff(e));

  return emps.map(emp=>{
    const recs=DB.attendance.filter(a=>
      a.employeeId===emp.id &&
      (a.status==="approved"||a.status==="corrected") &&
      a.timeOut &&
      new Date(a.timeIn)>=from &&
      new Date(a.timeIn)<=to
    );

    let regularSec=0,otSec=0;

    recs.forEach(att=>{
      const attStart=new Date(att.timeIn),attEnd=new Date(att.timeOut);
      const entries=(DB.jobTimeEntries||[]).filter(e=>
        e.employeeId===emp.id &&
        e.startTime && e.endTime &&
        new Date(e.startTime)<attEnd &&
        new Date(e.endTime)>attStart
      );

      if(!entries.length){
        regularSec+=(att.netMin||0)*60;
        return;
      }

      const cutoff=sydney4pmISO(att.timeIn);
      const otConfirmed=!!att.overtimeConfirmedAt;

      entries.forEach(e=>{
        const start=new Date(Math.max(new Date(e.startTime),attStart));
        const end=new Date(Math.min(new Date(e.endTime),attEnd));
        if(end<=start)return;

        if(otConfirmed&&end>cutoff){
          if(start<cutoff){
            const regEnd=cutoff;
            regularSec+=Math.max(0,overlapSeconds(start,regEnd,start,regEnd)-unpaidBreakOverlapSeconds(att,start,regEnd));
          }
          const otStart=start>cutoff?start:cutoff;
          otSec+=Math.max(0,overlapSeconds(otStart,end,otStart,end)-unpaidBreakOverlapSeconds(att,otStart,end));
        }else{
          regularSec+=Math.max(0,overlapSeconds(start,end,start,end)-unpaidBreakOverlapSeconds(att,start,end));
        }
      });
    });

    return {
      emp,
      regular:regularSec/3600,
      ot:otSec/3600,
      total:(regularSec+otSec)/3600,
      shifts:recs.length
    };
  }).filter(r=>r.shifts>0);
}

function buildNotifications(){
  const list = [];
  const s = DB.settings.notifications;
  const otThreshold = DB.settings.overtimeThresholdHrs*60;
  DB.attendance.forEach(a=>{
    const emp = DB.employees.find(e=>e.id===a.employeeId); if(!emp || emp.permission!=="Employee" && emp.permission!=="Manager") return;
    if(s.forgotTimeOut && !a.timeOut && !sameDay(a.timeIn,new Date())){
      list.push({icon:"⚠️", color:"var(--danger)", title:"Missing Clock Out", detail:`${emp.name} has not clocked out. Last recorded: ${fmtTime(a.timeIn)} on ${fmtDate(a.timeIn)}.`, time:fmtDateShort(a.timeIn)});
    }
    if(a.grossMin && a.grossMin>otThreshold){
      list.push({icon:"⏱", color:"var(--warn)", title:"Overtime", detail:`${emp.name} worked ${hm(a.grossMin)} on ${fmtDate(a.timeIn)} — ${hm(a.grossMin-otThreshold)} over threshold.`, time:fmtDateShort(a.timeIn)});
    }
    if(sameDay(a.timeIn,new Date())){
      const t = new Date(a.timeIn);
      if(t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin)){
        list.push({icon:"🔴", color:"var(--danger)", title:"Late Arrival", detail:`${emp.name} clocked in at ${fmtTime(a.timeIn)} today.`, time:"Today"});
      }
    }
    if(s.timesheetApproved && a.status==="submitted"){
      list.push({icon:"🔔", color:"var(--warn)", title:"Timesheet Awaiting Approval", detail:`${emp.name}'s shift on ${fmtDate(a.timeIn)} is submitted and awaiting your review.`, time:fmtDateShort(a.timeIn)});
    }
    if(s.timesheetRejected && a.status==="rejected"){
      list.push({icon:"✖", color:"var(--danger)", title:"Timesheet Rejected", detail:`${emp.name}'s shift on ${fmtDate(a.timeIn)} was rejected: ${a.rejectReason||''}`, time:fmtDateShort(a.timeIn)});
    }
  });
  if(s.xeroSyncFailure && !DB.settings.xero.connected){
    // informational only, not a failure — omit unless actually attempted
  }
  return list.sort((a,b)=> (a.title<b.title?1:-1));
}

const changed = Object.keys(before).filter(
  k => String(before[k] || "") !== String(j[k] || "")
);

if(!j.changeLog){
  j.changeLog = [];
}

const detail = changed.length
  ? `Updated ${changed
      .map(k => `${k} ("${before[k] || "—"}" → "${j[k] || "—"}")`)
      .join(", ")}.`
  : "Saved with no field changes.";

j.changeLog.push({
  actor: DB.session.name,
  ts: nowISO(),
  detail
});

audit(
  DB.session.name,
  "Edited job",
  j.name,
  detail
);

await recordJobHistory(
  j.id,
  "Edited Job",
  detail
);

save();
wrap.remove();
toast("Job updated");
go("admin-job-detail", { id: j.id });
  };
}

  document.body.appendChild(wrap);

  wrap.querySelector("#ajCancel").onclick = () => wrap.remove();

  if(wrap.querySelector("#ajSave")){

      ].map(cb => cb.value);

      if(selectedEmployeeIds.length === 0){
        toast("Select at least one employee.");
        return;
      }

      const assignmentRows = selectedEmployeeIds.map(empId => ({
        job_id: j.id,
        employee_id: empId
      }));

      const { error: assignmentError } = await supabaseClient
        .from("job_assignments")
        .insert(assignmentRows);

      if(assignmentError){
        console.error(
          "Supabase job assignment error:",
          assignmentError
        );

        toast("Employees could not be added to the job.");
        return;
      }

      selectedEmployeeIds.forEach(empId => {
        if(!j.assigned.includes(empId)){
          j.assigned.push(empId);
        }
      });

      const employeeNames = selectedEmployeeIds.map(
        empId => empName(empId)
      );

      const detail =
        `Added ${employeeNames.join(", ")} to job.`;

      audit(
        DB.session.name,
        "Added employees to job",
        j.name,
        detail
      );

      await recordJobHistory(
        j.id,
        selectedEmployeeIds.length === 1
          ? "Employee Added"
          : "Employees Added",
        detail
      );

      save();

      wrap.remove();

      toast(
        selectedEmployeeIds.length === 1
          ? "Employee added to job"
          : `${selectedEmployeeIds.length} employees added to job`
      );

      go("admin-job-detail", { id: j.id });
    };
  }
}

function baseFilteredAttendance(){
  const $ = id=>document.getElementById(id);
  const empId = $("repEmp").value, jobId = $("repJob").value, status=$("repStatus").value, dept=$("repDept").value;
  const from = $("repFrom").value ? new Date($("repFrom").value) : null;
  const to = $("repTo").value ? new Date($("repTo").value+"T23:59:59") : null;
  let rows = DB.attendance.filter(a=> { const e = DB.employees.find(e=>e.id===a.employeeId); return e && isFieldStaff(e); });
  if(empId) rows = rows.filter(a=>a.employeeId===empId);
  if(jobId) rows = rows.filter(a=>a.jobId===jobId);
  if(status) rows = rows.filter(a=>a.status===status);
  if(dept) rows = rows.filter(a=> DB.employees.find(e=>e.id===a.employeeId)?.department===dept);
  if(from) rows = rows.filter(a=>new Date(a.timeIn)>=from);
  if(to) rows = rows.filter(a=>new Date(a.timeIn)<=to);
  rows.sort((a,b)=>new Date(b.timeIn)-new Date(a.timeIn));
  return rows;
}
function baseFilteredJobTimeEntries(){
  const $=id=>document.getElementById(id);
  const empId=$("repEmp").value,jobId=$("repJob").value,dept=$("repDept").value,status=$("repStatus").value;
  const from=$("repFrom").value?new Date($("repFrom").value):null;
  const to=$("repTo").value?new Date($("repTo").value+"T23:59:59"):null;
  let rows=(DB.jobTimeEntries||[]).filter(e=>e.endTime&&e.durationSeconds!=null);
  if(empId) rows=rows.filter(e=>e.employeeId===empId);
  if(jobId) rows=rows.filter(e=>e.jobId===jobId);
  if(dept) rows=rows.filter(e=>DB.employees.find(x=>x.id===e.employeeId)?.department===dept);
  if(status) rows=rows.filter(e=>DB.attendance.some(a=>a.employeeId===e.employeeId&&a.status===status&&new Date(e.startTime)>=new Date(a.timeIn)&&new Date(e.startTime)<new Date(a.timeOut||Date.now())));
  if(from) rows=rows.filter(e=>new Date(e.startTime)>=from);
  if(to) rows=rows.filter(e=>new Date(e.startTime)<=to);
  rows.sort((a,b)=>new Date(b.startTime)-new Date(a.startTime));
  return rows;
}
function runReport(){
  const type = document.getElementById("repType").value;
  const rows = baseFilteredAttendance();
  const el = document.getElementById("reportResults");
  const overtimeThreshold = DB.settings.overtimeThresholdHrs*60;

  let header, tableRows, csvRows, title;

  if(type==="attendance"){
    title = `${rows.length} RECORDS · ${hm(rows.reduce((s,a)=>s+(a.netMin||0),0))} TOTAL`;
    header = ["Date","Employee","Job","In","Out","Net","Status"];
    tableRows = rows.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn), a.timeOut?fmtTime(a.timeOut):'—', a.netMin!=null?hm(a.netMin):'—', a.status]);
  } else if(type==="job-labour"){
  const entries=baseFilteredJobTimeEntries();
  const byJob={};
  entries.forEach(e=>{
    const k=e.jobId;byJob[k]=byJob[k]||{};
    byJob[k][e.employeeId]=(byJob[k][e.employeeId]||0)+(e.durationSeconds||0);
  });
  const flat=[];
  Object.entries(byJob).forEach(([jobId,emps])=>Object.entries(emps).forEach(([empId,seconds])=>flat.push({jobId,empId,seconds})));
  flat.sort((a,b)=>jobName(a.jobId).localeCompare(jobName(b.jobId)));
  const rate=id=>DB.employees.find(e=>e.id===id)?.hourlyRate||0;
  title=`${flat.length} JOB/EMPLOYEE LINES · ${hm(Math.round(flat.reduce((s,f)=>s+f.seconds,0)/60))} TOTAL`;
  header=["Job","Employee","Hours","Labour Cost"];
  tableRows=flat.map(f=>[jobName(f.jobId),empName(f.empId),hm(Math.round(f.seconds/60)),"$"+((f.seconds/3600)*rate(f.empId)).toFixed(2)]);
 } else if(type==="department"){
    const byDept = {};
    rows.forEach(a=>{ const d = DB.employees.find(e=>e.id===a.employeeId)?.department||"—"; byDept[d]=(byDept[d]||0)+(a.netMin||0); });
    title = `${Object.keys(byDept).length} DEPARTMENTS`;
    header = ["Department","Total Hours"];
    tableRows = Object.entries(byDept).map(([d,m])=>[d, hm(m)]);
  } else if(type==="late"){
    const late = rows.filter(a=>{ const t=new Date(a.timeIn); return t.getHours()>8 || (t.getHours()===8 && t.getMinutes()>DB.settings.lateThresholdMin); });
    title = `${late.length} LATE ARRIVALS`;
    header = ["Date","Employee","Job","Clock In","Minutes Late"];
    tableRows = late.map(a=>{ const t=new Date(a.timeIn); const lateMin = Math.max(0,(t.getHours()-8)*60+t.getMinutes()); return [fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn), lateMin+" min"]; });
  } else if(type==="missing"){
    const missing = rows.filter(a=>!a.timeOut && !sameDay(a.timeIn,new Date()));
    title = `${missing.length} MISSING CLOCK-OUTS`;
    header = ["Date","Employee","Job","Clock In"];
    tableRows = missing.map(a=>[fmtDateShort(a.timeIn), empName(a.employeeId), jobName(a.jobId), fmtTime(a.timeIn)]);
  } else if(type==="overtime"){
 const ot=[];
 rows.forEach(a=>{
  if(!a.timeOut||!a.overtimeConfirmedAt)return;
  const cutoff=sydney4pmISO(a.timeIn);
  let otSec=0;
  (DB.jobTimeEntries||[]).filter(e=>e.employeeId===a.employeeId&&e.startTime&&e.endTime&&new Date(e.startTime)<new Date(a.timeOut)&&new Date(e.endTime)>new Date(a.timeIn)).forEach(e=>{
   const start=new Date(Math.max(new Date(e.startTime),new Date(a.timeIn),cutoff));
   const end=new Date(Math.min(new Date(e.endTime),new Date(a.timeOut)));
   if(end>start)otSec+=Math.max(0,overlapSeconds(start,end,start,end)-unpaidBreakOverlapSeconds(a,start,end));
  });
  if(otSec>0)ot.push({a,otSec});
 });
 title=`${ot.length} OVERTIME SHIFTS · After 4:00 PM Sydney`;
 header=["Date","Employee","Job","Total Hours","Overtime"];
 tableRows=ot.map(x=>[fmtDateShort(x.a.timeIn),empName(x.a.employeeId),jobName(x.a.jobId),hm(x.a.netMin||0),hm(Math.round(x.otSec/60))]);
  }
else if(type==="location"){
 const exceptions=rows.filter(a=>a.geofence==="outside");
 title=`${exceptions.length} LOCATION EXCEPTIONS`;
 header=["Date","Employee","Job","Clock In","Location"];
 tableRows=exceptions.map(a=>[fmtDateShort(a.timeIn),empName(a.employeeId),jobName(a.jobId),fmtTime(a.timeIn),a.gpsIn?.address||"-"]);
}
  window.__lastReportHeader = header; window.__lastReportRows = tableRows;
  el.innerHTML = `
    <div class="row-between" style="margin:16px 0 10px;"><div class="h3">${title}</div>
      <div class="row gap-8">
        <button class="btn btn-ghost btn-sm" id="expCsv">Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="expPdf">Export PDF</button>
      </div>
    </div>
    <table>
      <tr>${header.map(h=>`<th>${h}</th>`).join("")}</tr>
      ${tableRows.map(r=>`<tr>${r.map(v=>`<td>${escapeHtml(String(v))}</td>`).join("")}</tr>`).join("")}
      ${tableRows.length===0? `<tr><td colspan="${header.length}" class="muted" style="text-align:center;padding:16px;">No matching records</td></tr>`:""}
    </table>`;
  document.getElementById("expCsv").onclick = exportCSV;
  document.getElementById("expPdf").onclick=exportPDF;
}
function exportCSV(){
  const header = window.__lastReportHeader||[]; const rows = window.__lastReportRows||[];
  const lines = [header.join(","), ...rows.map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))];
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href=url; link.download="upstage_report.csv"; link.click();
  audit(DB.session.name,"Exported report","Reports",`${rows.length} rows`); save();
}
function exportPDF(){
 const {jsPDF}=window.jspdf,doc=new jsPDF();
 const header=window.__lastReportHeader||[],rows=window.__lastReportRows||[];
 doc.setFontSize(16);doc.text("Upstage Co Report",14,18);
 doc.setFontSize(10);

 let y=30;
 doc.text(header.join("     "),14,y);y+=8;

 rows.forEach(r=>{
  doc.text(r.map(v=>String(v)).join("     "),14,y);
  y+=7;
  if(y>280){doc.addPage();y=20;}
 });

 doc.save("upstage_report.pdf");
 audit(DB.session.name,"Exported PDF report","Reports",rows.length+" rows");
}
